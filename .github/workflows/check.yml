name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    container: bioconductor/bioconductor_docker:devel
    env:
      R_REMOTES_NO_ERRORS_FROM_WARNINGS: "true"
      ## The PAT bundled in the container is invalid (HTTP 401).
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          BiocManager::install(c("remotes", "rcmdcheck"),
                               ask = FALSE, update = FALSE)
          ## Spectra (>= 1.23.7) may not be released yet: use GitHub main.
          BiocManager::install("rformassspectrometry/Spectra",
                               ask = FALSE, update = FALSE)
          remotes::install_deps(dependencies = TRUE,
                                repos = BiocManager::repositories())

      - name: Check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning",
                               check_dir = "check")

  ## Windows and macOS (PLAN 1.3). The Ubuntu job above is the reference.
  ## `continue-on-error` keeps an upstream binary problem from blocking a
  ## merge while this job is new; remove it once the job is stable.
  check-os:
    runs-on: ${{ matrix.os }}
    name: check-os (${{ matrix.os }})
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      ## mzR and MsDataHub (real-data tests, skipped when missing) are
      ## checked on Ubuntu only; they need compilation on these systems.
      _R_CHECK_FORCE_SUGGESTS_: "false"
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install dependencies
        shell: Rscript {0}
        run: |
          install.packages(c("BiocManager", "remotes", "rcmdcheck"))
          ## Spectra (>= 1.23.7) needs Bioconductor devel.
          BiocManager::install(version = "devel", ask = FALSE, update = FALSE)
          BiocManager::install("rformassspectrometry/Spectra",
                               ask = FALSE, update = FALSE)
          remotes::install_deps(dependencies = c("Depends", "Imports"),
                                repos = BiocManager::repositories())
          install.packages("testthat")

      - name: Check
        shell: Rscript {0}
        run: |
          rcmdcheck::rcmdcheck(args = "--no-manual", error_on = "warning",
                               check_dir = "check")
